<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campground Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Campground Finder</h1>
        <p>Find campgrounds and save your favorites.</p>
    </header>

    <main>
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search for a campground">
            <button id="searchButton">Search</button>
        </section>

        <section>
            <h2>Campground Results</h2>
            <div id="campgroundList"></div>
        </section>

        <section>
            <h2>Favorite Campgrounds</h2>
            <div id="favoritesList"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
